<section class="page-shell">
  <header class="page-header">
    <div class="page-title">
      <h1>Categorías</h1>
      <p>Organiza los productos de la tienda.</p>
    </div>
    <div class="header-actions">
      <button class="btn" type="button" (click)="openNew()">+ Nueva categoría</button>
    </div>
  </header>

  <section class="card surface-pad">
    <label class="category-search">
      Buscar categoría
      <input 
        [ngModel]="busqueda()" 
        (ngModelChange)="busqueda.set($event)" 
        placeholder="Buscar categoría..." 
        type="text" 
      />
    </label>
  </section>

  <section class="grid-auto">
    @for (categoria of categoriasFiltradas(); track categoria.id_categoria; let index = $index) {
      <article class="category-card">
        <div class="category-card__icon">{{ iconos[index % iconos.length] }}</div>
        <div>
          <h3>{{ categoria.nombre_categoria }}</h3>
          <p>{{ categoria.descripcion || 'Sin descripción' }}</p>
        </div>
        <app-status-badge [estado]="categoria.activo ? 'activo' : 'inactivo'" />
        <div class="category-card__actions">
          <button class="table-link" type="button" (click)="openEdit(categoria)">Editar</button>
          <button 
            class="table-link muted" 
            type="button" 
            (click)="desactivarRapido(categoria)"
            [disabled]="!categoria.activo"
            [class.disabled]="!categoria.activo"
          >
            {{ categoria.activo ? 'Desactivar' : 'Inactivo' }}
          </button>
        </div>
      </article>
    }
  </section>

  <app-categoria-form-modal #modal (save)="onSave($event)"></app-categoria-form-modal>
</section>
